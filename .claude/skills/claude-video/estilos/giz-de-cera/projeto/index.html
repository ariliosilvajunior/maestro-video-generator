<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<title>giz-de-cera · composição HyperFrames</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gochi+Hand&display=swap" />
<script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
<script src="motor.js"></script>
<script src="_pintura.js"></script>
<script src="giz-de-cera.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; background: #000; }
  #root { position: relative; width: 1920px; height: 1080px; overflow: hidden; }
  #tela { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; display: block; }
  /* Fontes de canvas só carregam se alguém na página usa a família. */
  .fonte-oculta { position: absolute; left: -9999px; top: -9999px; opacity: 0; pointer-events: none; }
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-start="0" data-duration="5" data-width="1920" data-height="1080">
  <canvas id="tela" width="1920" height="1080"></canvas>
  <span class="fonte-oculta" style="font-family: 'Gochi Hand'; font-weight: 400;">Gochi Hand</span>
  <span class="fonte-oculta" style="font-family: 'Gochi Hand'; font-weight: 800;">Gochi Hand</span>
</div>
<script>
  // Um estilo da Biblioteca de motion: render(ctx, t, theme, w, h), loop de 5 s, render(0) === render(5).
  const estilo = M.byId.get('giz-de-cera');
  const tema = estilo.tema;
  const canvas = document.getElementById('tela');
  const ctx = canvas.getContext('2d', { alpha: false });
  const W = 1920, H = 1080;

  function desenha(t) {
    ctx.save();
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.filter = 'none';
    ctx.shadowBlur = 0;
    ctx.shadowColor = 'transparent';
    ctx.letterSpacing = '0px';
    estilo.render(ctx, M.loopTime(t), tema, W, H);
    ctx.restore();
  }

  // Relógio: a timeline só anda o parâmetro p.t de 0 a 5; cada atualização redesenha o quadro.
  const p = { t: 0 };
  const tl = gsap.timeline({ paused: true });
  tl.to(p, { t: 5, duration: 5, ease: 'none', onUpdate: () => desenha(p.t) }, 0);
  window.__timelines = window.__timelines || {};
  window.__timelines.main = tl;

  // Fontes: espera carregar e redesenha o quadro atual (o plano de texto é medido uma vez e guardado).
  document.fonts.load("400 100px 'Gochi Hand'").catch(() => null);
  document.fonts.load("800 100px 'Gochi Hand'").catch(() => null);
  document.fonts.ready.then(() => desenha(tl.time()));
</script>
</body>
</html>
